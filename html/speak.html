<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak</title>
</head>
<body>
    <h1>Speak To Speech</h1>

    <textarea id="text" rows="4" cols="50"></textarea><br>
    <button id="speakbtn" onclick="speak()">Bolo Bhai</button>

    <script>
        function speak(){
            let synth = window.speechSynthesis;
            let voice = new SpeechSynthesisUtterance(`${text.value}`) 
            synth.speak(voice);
        }
    </script>
</body>
</html>
